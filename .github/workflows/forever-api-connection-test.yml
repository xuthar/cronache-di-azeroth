name: Probe Blizzard Forever EU profile (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forever-api-connection-test.yml'
permissions:
  contents: read
concurrency:
  group: forever-api-read-only-probe
  cancel-in-progress: true
jobs:
  probe:
    name: Test OAuth and Xuthar Forever profile
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out safe probe source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only probe script
        run: node --check scripts/forever-api/probe.mjs
      - name: Verify client credentials and official character profile
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          FOREVER_PROFILE_NAMESPACE: ${{ vars.FOREVER_PROFILE_NAMESPACE }}
          FOREVER_XUTHAR_SLUG: ${{ vars.FOREVER_XUTHAR_SLUG }}
        run: node scripts/forever-api/probe.mjs
