name: Clear stale GitHub Pages deployment
on:
  push:
    paths:
      - .github/workflows/pages-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Clear stale Pages deployment blocking new publishes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_SHA: cca94aaea1e1079afcb6acaccd6e6898099938d2
        shell: bash
        run: |
          set -euo pipefail
          url="repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_SHA}"
          echo "Inspecting Pages deployment ${STALE_SHA}..."
          status="$(gh api "${url}" --jq '.status' 2>/dev/null || true)"
          echo "Reported deployment status: ${status:-unavailable}"
          # Pages can falsely report "succeed" while its deployment lock remains.
          # We cancel only this exact known stale SHA, even if its status says succeeded.
          echo "Requesting cancellation of the stale Pages deployment lock..."
          gh api -X POST "${url}/cancel"
          echo "Cancellation API accepted."
