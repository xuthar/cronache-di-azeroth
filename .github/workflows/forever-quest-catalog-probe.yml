name: Probe Forever static quest metadata (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forever-quest-catalog-probe.yml'
permissions:
  contents: read
jobs:
  static-quests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script
        run: node --check scripts/forever-api/quest-catalog-probe.mjs
      - name: Probe official quest metadata
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/forever-api/quest-catalog-probe.mjs
